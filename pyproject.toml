[project]
name = "sweep"
version = "0.1"
description = "Measurement orchestration for QCoDeS"
authors = [
    { name = "spxtr", email = "spxtr@stanford.edu" },
]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "matplotlib",
    "scipy",
    "tqdm",
    "ipython",
    "qcodes",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "pre-commit",
    "ty>=0.0.17",
]

[tool.pytest.ini_options]
testpaths = ["sweep"]
python_files = ["*_test.py"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
